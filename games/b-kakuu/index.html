<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>兵糧奉行(試作)</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header>
    <h1>兵糧奉行 <small>試作 0.3</small> <small id="seed"></small></h1>
    <label class="scenario-pick">シナリオ <select id="scenario"></select></label>
    <div id="clock"></div>
    <div class="controls">
      <button id="btn-play" type="button">▶ 進める</button>
      <button id="btn-speed" type="button">×1</button>
      <label class="check"><input id="chk-autopause" type="checkbox" checked /> 到着で止める</label>
      <button id="btn-glossary" type="button">用語集</button>
      <button id="btn-share-open" type="button">共有を読む</button>
    </div>
  </header>
  <main>
    <div id="map-wrap"><canvas id="map"></canvas></div>
    <aside id="panel">
      <p id="hint" class="hint"></p>
      <section>
        <h2><span class="term" tabindex="0" role="button" data-term="撤退">撤退</span>の備え</h2>
        <div id="retreat" class="retreat"></div>
      </section>
      <section>
        <h2><span class="term" tabindex="0" role="button" data-term="ルールカード">ルールカード</span>と自動便</h2>
        <div id="cards" class="cards"></div>
      </section>
      <section id="markets-sec" hidden>
        <h2><span class="term" tabindex="0" role="button" data-term="市">市</span>(現地で買う)</h2>
        <div id="markets" class="cards"></div>
      </section>
      <section>
        <h2><span class="term" tabindex="0" role="button" data-term="運搬隊">運搬隊</span></h2>
        <div id="convoys"></div>
      </section>
      <section id="order" hidden>
        <h2>指図</h2>
        <div id="order-body"></div>
      </section>
      <section>
        <h2>報告</h2>
        <ol id="log"></ol>
      </section>
    </aside>
  </main>
  <div id="result" hidden>
    <div class="result-box">
      <p id="result-stars" class="stars"></p>
      <p id="result-text"></p>
      <div id="result-share" class="share"></div>
      <button id="btn-retry" type="button">もう一度</button>
    </div>
  </div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <dialog id="glossary" class="glossary">
    <h2 tabindex="-1" autofocus>用語集</h2>
    <dl class="glossary-list"></dl>
    <button type="button" class="glossary-close">閉じる</button>
  </dialog>
  <dialog id="share-dialog" class="glossary">
    <h2 tabindex="-1">共有文字列を読む</h2>
    <p class="note">受け取った文字列(HY1-…)を貼り付けてください。</p>
    <textarea id="share-input" rows="3" spellcheck="false"></textarea>
    <div class="row"><button type="button" id="btn-share-read">読む</button><button type="button" class="glossary-close" id="btn-share-close">閉じる</button></div>
    <div id="share-out"></div>
  </dialog>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
